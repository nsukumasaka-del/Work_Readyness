<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      try {
        const mode = localStorage.getItem('bonlist-theme') || 'dark';
        const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch {
        document.documentElement.classList.add('dark');
      }
    </script>
    <title>BonList — Practical career tools for South Africa</title>
    <meta name="description" content="BonList helps South African job seekers improve their CV, find local roles, practise interviews, and apply for human career coaching." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.bonlist.site/" />
    <meta property="og:title" content="BonList" />
    <meta property="og:description" content="CV diagnostics, local job matches, interview practice, and coaching — built for the South African market." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.bonlist.site/" />
    <meta property="og:locale" content="en_ZA" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BonList" />
    <meta name="twitter:description" content="CV diagnostics, local job matches, interview practice, and coaching — built for the South African market." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/bonlist-mark.png" />
    <meta property="og:image" content="https://www.bonlist.site/brand/bonlist-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Runs before module loading: even an unavailable entry script gets a
      // useful recovery screen rather than leaving only the SEO fallback.
      window.addEventListener('error', function (event) {
        if (document.documentElement.dataset.bonlistMounted === 'true') return;
        var target = event.target;
        var entryFailed = target && target.tagName === 'SCRIPT' && target.type === 'module'
          && /\/assets\/index-[^/]+\.js|\/src\/main\.tsx/.test(target.src || '');
        if (!entryFailed && !(event instanceof ErrorEvent)) return;
        var root = document.getElementById('root');
        if (!root || root.querySelector('[data-startup-recovery]')) return;
        var panel = document.createElement('main');
        panel.setAttribute('data-startup-recovery', 'true');
        panel.setAttribute('role', 'alert');
        panel.style.cssText = 'max-width:560px;margin:48px auto;padding:24px;font-family:system-ui,sans-serif;color:#172033;background:#fff;border-radius:16px';
        var heading = document.createElement('h1');
        heading.textContent = 'BonList could not start';
        var message = document.createElement('p');
        message.textContent = 'Please check your connection and try again. Your saved documents have not been removed.';
        var retry = document.createElement('button');
        retry.type = 'button';
        retry.textContent = 'Try again';
        retry.style.cssText = 'padding:12px 20px;border:0;border-radius:8px;background:#172033;color:#fff;cursor:pointer';
        retry.addEventListener('click', function () { window.location.reload(); });
        panel.append(heading, message, retry);
        root.replaceChildren(panel);
      }, true);
    </script>
    <noscript>BonList needs JavaScript to open its interactive CV tools. Please enable JavaScript in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
