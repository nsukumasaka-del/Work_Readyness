# BonList — Cloudflare Worker (static SPA + /api gateway)
#
# Cloudflare dashboard → Workers & Pages → bonlist → Settings → Variables:
#   API_UPSTREAM_URL = https://YOUR-NODE-API-HOST   (no trailing slash)
#
# That upstream must be the Express api-server (serves /api/*).
# Deploy command can stay: npx wrangler deploy

name = "bonlist"
main = "workers/gateway.ts"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "./artifacts/careerbridge-sa/dist/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Ensure /api hits the Worker before static assets (prevents HTTP 405 on POST).
run_worker_first = ["/api", "/api/*"]
