name: Build BonList Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Live BonList site URL for the WebView/API (e.g. https://your-bonlist.app). Leave empty to use repo variable LIVE_APP_URL or bundle local assets only."
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "mobile/bonlist-android/**"
      - "artifacts/careerbridge-sa/**"
      - "workers/**"
      - "scripts/stage-android-apk.mjs"
      - "wrangler.toml"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Resolve live app URL
        id: live
        run: |
          INPUT="${{ github.event.inputs.server_url }}"
          VAR="${{ vars.LIVE_APP_URL }}"
          URL=""
          if [ -n "$INPUT" ]; then URL="$INPUT"; elif [ -n "$VAR" ]; then URL="$VAR"; fi
          URL="${URL%/}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          if [ -n "$URL" ]; then
            echo "Using LIVE_APP_URL=$URL"
          else
            echo "No LIVE_APP_URL set — APK will bundle static assets without a remote API origin."
          fi

      - name: Install monorepo deps
        run: pnpm install --frozen-lockfile

      - name: Build web app
        env:
          # Avoid Cap sync during web build (Android SDK/JDK not ready yet)
          BONLIST_SKIP_MOBILE_POSTBUILD: "1"
          VITE_API_BASE_URL: ${{ steps.live.outputs.url }}
        run: pnpm --filter @workspace/careerbridge-sa run build

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor deps + sync
        working-directory: mobile/bonlist-android
        env:
          LIVE_APP_URL: ${{ steps.live.outputs.url }}
          CAP_SERVER_URL: ${{ steps.live.outputs.url }}
          VITE_API_BASE_URL: ${{ steps.live.outputs.url }}
        run: |
          npm install
          node ./scripts/write-capacitor-config.mjs
          node ./scripts/sync-web.mjs --cap-sync

      - name: Prepare update-compatible signing key
        env:
          BONLIST_APK_KEYSTORE_BASE64: ${{ secrets.BONLIST_APK_KEYSTORE_BASE64 }}
          BONLIST_APK_STORE_PASSWORD: ${{ secrets.BONLIST_APK_STORE_PASSWORD }}
          BONLIST_APK_KEY_ALIAS: ${{ secrets.BONLIST_APK_KEY_ALIAS }}
          BONLIST_APK_KEY_PASSWORD: ${{ secrets.BONLIST_APK_KEY_PASSWORD }}
        run: |
          if [ -z "$BONLIST_APK_KEYSTORE_BASE64" ] || [ -z "$BONLIST_APK_STORE_PASSWORD" ] || [ -z "$BONLIST_APK_KEY_ALIAS" ] || [ -z "$BONLIST_APK_KEY_PASSWORD" ]; then
            echo "Stable APK signing secrets are required before publishing an in-place Android update." >&2
            exit 1
          fi
          printf '%s' "$BONLIST_APK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bonlist-update.jks"
          echo "BONLIST_APK_KEYSTORE=$RUNNER_TEMP/bonlist-update.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: mobile/bonlist-android/android
        env:
          BONLIST_APK_STORE_PASSWORD: ${{ secrets.BONLIST_APK_STORE_PASSWORD }}
          BONLIST_APK_KEY_ALIAS: ${{ secrets.BONLIST_APK_KEY_ALIAS }}
          BONLIST_APK_KEY_PASSWORD: ${{ secrets.BONLIST_APK_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK update signing identity
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then echo "Android apksigner is unavailable." >&2; exit 1; fi
          CURRENT="artifacts/careerbridge-sa/public/downloads/BonList.apk"
          NEXT="mobile/bonlist-android/android/app/build/outputs/apk/release/app-release.apk"
          OLD_CERT="$("$APKSIGNER" verify --print-certs "$CURRENT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          NEW_CERT="$("$APKSIGNER" verify --print-certs "$NEXT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          if [ -z "$OLD_CERT" ] || [ "$OLD_CERT" != "$NEW_CERT" ]; then
            echo "The new APK signing certificate does not match the currently published APK." >&2
            exit 1
          fi

      - name: Stage APK for web download and Cloudflare assets
        run: |
          node scripts/stage-android-apk.mjs release
          ls -lh artifacts/careerbridge-sa/public/downloads/BonList.apk
          cat artifacts/careerbridge-sa/public/downloads/apk-manifest.json

      - name: Deploy web assets and APK to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config wrangler.toml

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BonList-apk
          path: |
            artifacts/careerbridge-sa/public/downloads/BonList.apk
            artifacts/careerbridge-sa/public/downloads/apk-manifest.json
          if-no-files-found: error

      - name: Publish GitHub Release (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: BonList Android ${{ github.run_number }}
          files: artifacts/careerbridge-sa/public/downloads/BonList.apk
          generate_release_notes: true
