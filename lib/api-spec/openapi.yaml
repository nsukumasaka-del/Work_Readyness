openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: career
    description: Career platform operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /career/overview:
    get:
      operationId: getCareerOverview
      tags: [career]
      summary: Get the current career platform overview
      responses:
        "200":
          description: Career overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerOverview"
  /career/profile:
    post:
      operationId: createProfile
      tags: [career]
      summary: Create a visitor profile before CV upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileInput"
      responses:
        "201":
          description: Profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
  /career/jobs:
    get:
      operationId: listJobs
      tags: [career]
      summary: List South African job matches
      parameters:
        - name: location
          in: query
          required: false
          schema:
            type: string
        - name: sector
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Matching jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobMatch"
  /career/diagnostic:
    post:
      operationId: createDiagnostic
      tags: [career]
      summary: Create a CV diagnostic report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagnosticInput"
      responses:
        "201":
          description: Diagnostic report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticReport"
  /career/smokey:
    post:
      operationId: askSmokey
      tags: [career]
      summary: Ask Smokey, the career agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmokeyInput"
      responses:
        "200":
          description: Smokey reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmokeyReply"
  /career/interview:
    get:
      operationId: getInterviewPrep
      tags: [career]
      summary: Get interview practice prompts
      responses:
        "200":
          description: Interview preparation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewPrep"
  /career/coaching:
    post:
      operationId: applyForCoaching
      tags: [career]
      summary: Submit an application for coaching
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachingApplicationInput"
      responses:
        "201":
          description: Coaching application received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachingApplication"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CareerOverview:
      type: object
      required: [diagnosticScore, jobMatchCount, interviewProgress, latestRole, profileCount]
      properties:
        diagnosticScore:
          type: integer
        jobMatchCount:
          type: integer
        interviewProgress:
          type: integer
        latestRole:
          type: string
        profileCount:
          type: integer
    UserProfileInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        location:
          type: string
        targetRole:
          type: string
    UserProfile:
      type: object
      required: [id, name, email, createdAt, profileCount]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        location:
          type: string
        targetRole:
          type: string
        createdAt:
          type: string
        profileCount:
          type: integer
    JobMatch:
      type: object
      required: [id, title, company, location, sector, salary, match, posted, tags]
      properties:
        id:
          type: integer
        title:
          type: string
        company:
          type: string
        location:
          type: string
        sector:
          type: string
        salary:
          type: string
        match:
          type: integer
        posted:
          type: string
        tags:
          type: array
          items:
            type: string
        source:
          type: string
        url:
          type: string
        description:
          type: string
          description: Job specification summary shown on BonList before applying on the source board.
    DiagnosticJobSearch:
      type: object
      required: [query, queriedBoards, liveResults]
      properties:
        query:
          type: string
        queriedBoards:
          type: array
          items:
            type: string
        liveResults:
          type: boolean
    DiagnosticInput:
      type: object
      required: [fileName]
      properties:
        fileName:
          type: string
        role:
          type: string
        location:
          type: string
        profileId:
          type: integer
    DiagnosticScoreBreakdown:
      type: object
      required: [clarity, impact, structure, keywordFit, authenticity, ats]
      properties:
        clarity:
          type: integer
        impact:
          type: integer
        structure:
          type: integer
        keywordFit:
          type: integer
        authenticity:
          type: integer
        ats:
          type: integer
    DiagnosticFinding:
      type: object
      required: [title, detail]
      properties:
        title:
          type: string
        detail:
          type: string
        priority:
          type: string
    DiagnosticSectionReview:
      type: object
      required: [section, score, status, findings]
      properties:
        section:
          type: string
        score:
          type: integer
        status:
          type: string
        findings:
          type: array
          items:
            type: string
    DiagnosticRewrite:
      type: object
      required: [before, after]
      properties:
        before:
          type: string
        after:
          type: string
    DiagnosticReport:
      type: object
      required:
        - id
        - fileName
        - targetRole
        - summary
        - overallScore
        - authenticityScore
        - atsScore
        - scores
        - strengths
        - improvements
        - sectionReviews
        - flaggedPhrases
        - missingKeywords
        - rewriteExamples
        - prompts
        - relatedJobs
        - jobSearch
      properties:
        id:
          type: integer
        fileName:
          type: string
        targetRole:
          type: string
        summary:
          type: string
        overallScore:
          type: integer
        authenticityScore:
          type: integer
        atsScore:
          type: integer
        scores:
          $ref: "#/components/schemas/DiagnosticScoreBreakdown"
        strengths:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticFinding"
        improvements:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticFinding"
        sectionReviews:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticSectionReview"
        flaggedPhrases:
          type: array
          items:
            type: string
        missingKeywords:
          type: array
          items:
            type: string
        rewriteExamples:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticRewrite"
        prompts:
          type: array
          items:
            type: string
        relatedJobs:
          type: array
          items:
            $ref: "#/components/schemas/JobMatch"
        jobSearch:
          $ref: "#/components/schemas/DiagnosticJobSearch"
    SmokeyInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
        role:
          type: string
        fileName:
          type: string
    SmokeyReply:
      type: object
      required: [reply, suggestions]
      properties:
        reply:
          type: string
        suggestions:
          type: array
          items:
            type: string
    InterviewPrep:
      type: object
      required: [completed, total, questions]
      properties:
        completed:
          type: integer
        total:
          type: integer
        questions:
          type: array
          items:
            $ref: "#/components/schemas/InterviewQuestion"
    InterviewQuestion:
      type: object
      required: [id, question, context, hint]
      properties:
        id:
          type: integer
        question:
          type: string
        context:
          type: string
        hint:
          type: string
    CoachingApplicationInput:
      type: object
      required: [name, email, experience, goals, paymentPlan]
      properties:
        name:
          type: string
        email:
          type: string
        experience:
          type: string
        goals:
          type: string
        paymentPlan:
          type: string
    CoachingApplication:
      type: object
      required: [id, status, message]
      properties:
        id:
          type: integer
        status:
          type: string
        message:
          type: string

