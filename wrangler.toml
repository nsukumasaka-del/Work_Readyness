# BonList — Cloudflare Worker (static assets)
#
# Cloudflare dashboard (Workers Builds / Git integration):
#   Root directory:   /
#   Build command:    (leave empty — deploy shim builds the web app)
#   Deploy command:   npx wrangler deploy
#                     OR  pnpm run deploy
#
# Monorepo note: bare `wrangler deploy` normally fails at a pnpm workspace root.
# Root postinstall installs a shim so Cloudflare's default command works.
# Prefer: npx wrangler deploy -c wrangler.toml

name = "bonlist"
compatibility_date = "2025-09-01"
workers_dev = true

# Serve the Vite build as a static Worker (SPA).
[assets]
directory = "./artifacts/careerbridge-sa/dist/public"
not_found_handling = "single-page-application"
