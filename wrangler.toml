# BonList — Cloudflare Pages (static web app)
#
# Cloudflare dashboard → Workers & Pages → your project → Settings → Builds:
#   Root directory:   /
#   Build command:    (leave empty — deploy script builds)
#   Deploy command:   pnpm run deploy
#   OR                pnpm run cf:deploy
#
# Do NOT use plain `npx wrangler deploy` at the monorepo root — it fails with
# "application detection logic has been run in the root of a workspace".

name = "bonlist"
compatibility_date = "2025-09-01"
pages_build_output_dir = "artifacts/careerbridge-sa/dist/public"
