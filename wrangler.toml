# BonList — Cloudflare Worker (static SPA + D1 auth + optional /api gateway)
#
# Auth (login/register/sessions) runs on Cloudflare D1 — free & durable.
# Optional: set API_UPSTREAM_URL for CV/jobs/coaching Express routes on Render.
#
#   API_UPSTREAM_URL = https://YOUR-NODE-API-HOST   (no trailing slash)
#
# Deploy: pnpm run cf:deploy

name = "bonlist"
main = "workers/gateway.ts"
compatibility_date = "2025-09-01"
workers_dev = true

# CV / jobs / diagnostics API (Render). Auth itself uses D1 and does not need this.
[vars]
API_UPSTREAM_URL = "https://bonlist-api-yj0d.onrender.com"

[[d1_databases]]
binding = "DB"
database_name = "bonlist-db"
database_id = "32f06e98-d912-43ce-9ebf-206c82224b6e"
preview_database_id = "32f06e98-d912-43ce-9ebf-206c82224b6e"

[assets]
directory = "./artifacts/careerbridge-sa/dist/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Ensure /api hits the Worker before static assets (prevents HTTP 405 on POST).
run_worker_first = ["/api", "/api/*"]
