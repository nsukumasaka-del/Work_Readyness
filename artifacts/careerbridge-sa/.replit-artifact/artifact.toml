kind = "web"
previewPath = "/"
title = "CareerBridge SA"
description = "A human-first South African career platform that reviews CVs, finds matching jobs, prepares candidates for interviews, and connects them with a structured coaching program."
version = "1.0.0"
id = "artifacts/careerbridge-sa"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19678

[services.development]
run = "pnpm --filter @workspace/careerbridge-sa run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/careerbridge-sa", "run", "build" ]
serve = "static"
publicDir = "artifacts/careerbridge-sa/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19678"
BASE_PATH = "/"
