# BonList — Cloudflare Worker (static SPA + D1 auth + optional /api gateway)
#
# Auth (login/register/sessions) runs on Cloudflare D1 — free & durable.
# Optional: set API_UPSTREAM_URL for CV/jobs/coaching Express routes on Render.
#
#   API_UPSTREAM_URL = https://YOUR-NODE-API-HOST   (no trailing slash)
#
# Deploy: pnpm run cf:deploy

name = "bonlist"
main = "workers/gateway.ts"
compatibility_date = "2025-09-01"
workers_dev = true

# CV / jobs / diagnostics API (Render). Auth itself uses D1 and does not need this.
[vars]
API_UPSTREAM_URL = "https://bonlist-api-yj0d.onrender.com"
# Production: keep false so signup/forgot-password fail clearly when email isn't wired.
AUTH_ALLOW_DEV_OTP = "false"
# Primary admin (D1). Password can also be set as a Worker secret PRIMARY_ADMIN_PASSWORD.
PRIMARY_ADMIN_EMAIL = "nsukumasaka@gmail.com"
PRIMARY_ADMIN_NAME = "Ntokozo Sukumasaka"
# Public site origin used in password-reset emails and OAuth redirect URIs.
APP_BASE_URL = "https://bonlist.nsukumasaka.workers.dev"

# Secrets (set via CLI, not committed):
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put EMAIL_FROM
#   npx wrangler secret put INTERNAL_EMAIL_SECRET   # shared with Render for SMTP bridge
#   npx wrangler secret put GOOGLE_CLIENT_ID
#   npx wrangler secret put GOOGLE_CLIENT_SECRET
#   npx wrangler secret put LINKEDIN_CLIENT_ID
#   npx wrangler secret put LINKEDIN_CLIENT_SECRET
#   npx wrangler secret put FACEBOOK_APP_ID
#   npx wrangler secret put FACEBOOK_APP_SECRET
# EMAIL_FROM example: BonList <onboarding@yourdomain.com>
# OAuth callback URLs:
#   https://bonlist.nsukumasaka.workers.dev/api/auth/oauth/google/callback
#   https://bonlist.nsukumasaka.workers.dev/api/auth/oauth/linkedin/callback
#   https://bonlist.nsukumasaka.workers.dev/api/auth/oauth/facebook/callback

[[d1_databases]]
binding = "DB"
database_name = "bonlist-db"
database_id = "32f06e98-d912-43ce-9ebf-206c82224b6e"
preview_database_id = "32f06e98-d912-43ce-9ebf-206c82224b6e"

[assets]
directory = "./artifacts/careerbridge-sa/dist/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Ensure /api hits the Worker before static assets (prevents HTTP 405 on POST).
run_worker_first = ["/api", "/api/*"]
