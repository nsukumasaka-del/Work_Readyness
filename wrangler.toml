# BonList — Cloudflare Worker (static SPA + D1 auth on the edge)
#
# Auth, email (Resend), and OAuth run 100% on Cloudflare Workers + D1.
# Optional: API_UPSTREAM_URL for legacy non-auth /api routes during migration.
#
# Deploy: pnpm run cf:deploy

# Cloudflare Workers Builds deploys this project as `work-readyness`.
# Keep the name aligned so Wrangler does not rewrite the config during CI.
name = "work-readyness"
main = "workers/gateway.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
# This Worker is for the custom-domain deployment. Keep workers.dev disabled while the
# custom route is assigned in Cloudflare so there is no conflict between the main site
# and the preview workers.dev URL.
workers_dev = false
route = "https://www.bonlist.site/*"

# The bonlist.site route is already owned by the existing `bonlist` Worker.
# Do not declare it here: Cloudflare rejects deployments when two Workers claim
# the same route. Assign the custom-domain route to this Worker in Cloudflare
# after the old Worker is retired; the workers.dev endpoint remains available.

[vars]
# Local/dev only — never leave true in production once Resend is wired.
AUTH_ALLOW_DEV_OTP = "false"
PRIMARY_ADMIN_EMAIL = "nsukumasaka@gmail.com"
PRIMARY_ADMIN_NAME = "Ntokozo Sukumasaka"
# Used for password-reset links + OAuth redirect_uri base.
APP_BASE_URL = "https://www.bonlist.site"
# Legacy proxy for non-auth career APIs (CV diagnostic, jobs) during edge migration.
# Auth/email/OAuth do NOT use this. Remove when those routes run on Workers.
API_UPSTREAM_URL = "https://bonlist-api-yj0d.onrender.com"

# ---------------------------------------------------------------------------
# Secrets (never commit) — set with:
#   npx wrangler secret put <NAME>
#
# Required for signup OTP + forgot-password:
#   RESEND_API_KEY
#   EMAIL_FROM          e.g. BonList <noreply@your-verified-domain.com>
#                       (or BonList <onboarding@resend.dev> while testing to account owner)
#
# Optional admin bootstrap:
#   PRIMARY_ADMIN_PASSWORD
#
# Social OAuth (enable buttons when set):
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
#   LINKEDIN_CLIENT_ID
#   LINKEDIN_CLIENT_SECRET
#   FACEBOOK_CLIENT_ID
#   FACEBOOK_CLIENT_SECRET
#
# OAuth callback URLs (register in each provider console):
#   https://bonlist.nsukumasaka.workers.dev/api/auth/oauth/google/callback
#   https://bonlist.nsukumasaka.workers.dev/api/auth/oauth/linkedin/callback
#   https://bonlist.nsukumasaka.workers.dev/api/auth/oauth/facebook/callback
# ---------------------------------------------------------------------------

[[d1_databases]]
binding = "DB"
database_name = "bonlist-db"
database_id = "32f06e98-d912-43ce-9ebf-206c82224b6e"
preview_database_id = "32f06e98-d912-43ce-9ebf-206c82224b6e"

[assets]
directory = "./artifacts/careerbridge-sa/dist/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*"]
